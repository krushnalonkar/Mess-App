<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#1a1a2e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>🍽️ My Mess Tracker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- HEADER -->
  <header class="header">
    <div class="header-left">
      <span class="app-icon">🍽️</span>
      <div>
        <div class="app-title">My Mess Tracker</div>
        <div class="app-sub">Personal Attendance</div>
      </div>
    </div>
    <button class="settings-btn" onclick="openSettings()">⚙️</button>
  </header>

  <!-- MONTH SELECTOR -->
  <div class="month-bar">
    <button class="month-nav" onclick="changeMonth(-1)">‹</button>
    <div class="month-label" id="monthLabel">November 2026</div>
    <button class="month-nav" onclick="changeMonth(1)">›</button>
  </div>

  <!-- SUMMARY CARDS -->
  <div class="summary-grid">
    <div class="sum-card green">
      <div class="sum-num" id="sumFull">0</div>
      <div class="sum-lbl">Full Days</div>
      <div class="sum-amt" id="sumFullAmt">₹0</div>
    </div>
    <div class="sum-card orange">
      <div class="sum-num" id="sumHalf">0</div>
      <div class="sum-lbl">Half Days</div>
      <div class="sum-amt" id="sumHalfAmt">₹0</div>
    </div>
    <div class="sum-card red">
      <div class="sum-num" id="sumLeave">0</div>
      <div class="sum-lbl">Leaves</div>
      <div class="sum-amt">₹0</div>
    </div>
  </div>

  <!-- TOTAL BILL -->
  <div class="bill-banner">
    <div class="bill-label">MONTHLY MESS BILL</div>
    <div class="bill-amount" id="billAmount">₹0</div>
    <div class="bill-month" id="billMonth">November 2026</div>
  </div>

  <!-- ATTENDANCE LIST -->
  <div class="section-title">Daily Attendance</div>
  <div class="attendance-list" id="attendanceList">
    <!-- Days injected by JS -->
  </div>

  <!-- SETTINGS MODAL -->
  <div class="modal-overlay" id="settingsModal" onclick="closeSettings(event)">
    <div class="modal-box">
      <div class="modal-title">⚙️ Settings</div>

      <label class="modal-label">Mess Start Date (this month)</label>
      <input type="number" id="startDay" class="modal-input" min="1" max="31" placeholder="e.g. 19" />

      <label class="modal-label">Full Mess Rate (per day)</label>
      <div class="rate-row">
        <span>₹</span>
        <input type="number" id="rateFullMess" class="modal-input small" value="120" />
      </div>

      <label class="modal-label">Half Mess Rate (per meal)</label>
      <div class="rate-row">
        <span>₹</span>
        <input type="number" id="rateHalfMess" class="modal-input small" value="60" />
      </div>

      <button class="save-btn" onclick="saveSettings()">💾 Save Settings</button>
      <button class="close-btn" onclick="closeSettingsBtn()">✕ Close</button>
    </div>
  </div>

  <!-- TOAST -->
  <div class="toast" id="toast"></div>

  <script src="app.js"></script>
</body>
</html>
